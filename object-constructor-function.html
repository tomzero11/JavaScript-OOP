<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Construnctor Function</title>
</head>
<body>
    <script>

        /*
            Constructor Function
        => Jika ingin membuat data object di class (OOP) gunakan kata kunci "new"
        => new dignkana untuk membuat data object baru dari class tersebut
        */

        // OOP di JavaScipt Versi Lama 
        // Contoh Contructor Function
        function Person() {
            
        }

        // membuat object atau data baru dari class gunakan kata kunci new
        // Lalu di ikuti nama Constructor Function nya
        const eko = new Person() // kata kunci new lalu di ikuti Constructor Function
        eko.fistName = "Eko"
        console.log(eko)


    </script>
</body>
</html>
