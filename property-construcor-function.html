<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property di Constructor Function</title>
</head>
<body>
    
    <script>

        /*
            Property di Constructor Function
        => Untuk menambahkan property di dalam sebuah Constructor fuction
            kita bisa menggunakan kata kunci "this" lalu diikuti dengan nama property nya
        */

        // Buat Property di Constructor Function
        function Person() {
            this.firstName  = ""
            this.lastName   = "" 
        }
        
        const eko = new Person()
        eko.firstName = "Eko"
        eko.middleName = "Kusnandar"


        const budi = new Person()
        budi.firstName  = "Budi"
        budi.lastName = "Nugraha"
        
        console.log(eko)
        console.log(budi)

    </script>

</body>
</html>
